[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-ai"
version = "0.1.0"
description = "AI-powered e-commerce value-ranking and product intelligence backend"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "redis>=5.0,<8.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "langgraph>=0.2,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "fakeredis>=2.25,<3.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-m", "not live"]
markers = [
    "live: opt-in live external API tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["commerce_ai"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
